<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美業後台營運報表系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6F2;
    --surface:#FFFFFF;
    --surface-2:#F5EBE7;
    --ink:#2B1F27;
    --ink-soft:#8A757C;
    --primary:#7A2E43;
    --primary-light:#9C4A61;
    --primary-tint:#F3E4E8;
    --accent:#C98A9C;
    --positive:#4F7A5B;
    --positive-tint:#E7F0E9;
    --negative:#B5484F;
    --negative-tint:#FBEAEA;
    --border:#E8DDD8;
    --radius:12px;
    --shadow:0 2px 10px rgba(43,31,39,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Noto Serif TC', serif;}

  /* ---------- Header ---------- */
  .app-header{
    padding:22px 18px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid var(--border);
    background:var(--surface);
  }
  .app-logo{
    width:44px;height:44px;border-radius:50%;
    background:var(--primary);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;flex-shrink:0;
    color:#fff;
  }
  .app-title{font-size:19px;font-weight:700;color:var(--primary);line-height:1.3;}
  .app-subtitle{font-size:12px;color:var(--ink-soft);margin-top:2px;letter-spacing:0.5px;}
  .header-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .storage-badge{
    font-size:11px;color:var(--ink-soft);background:var(--surface-2);
    padding:4px 9px;border-radius:12px;white-space:nowrap;
    border:none;cursor:pointer;font-family:inherit;
  }
  .storage-badge:hover, .storage-badge:active{background:var(--primary-tint);color:var(--primary);}
  @media (max-width:640px){
    .app-header{flex-wrap:wrap;}
    .header-actions{width:100%;justify-content:flex-start;margin-top:8px;}
  }

  /* ---------- Tabs ---------- */
  .tab-bar{
    display:flex;
    gap:4px;
    padding:10px 12px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    position:sticky;top:0;z-index:20;
  }
  .tab-btn{
    border:none;background:transparent;
    padding:9px 16px;
    border-radius:20px;
    font-family:'Noto Sans TC',sans-serif;
    font-size:14px;font-weight:500;
    color:var(--ink-soft);
    white-space:nowrap;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .tab-btn.active{background:var(--primary);color:#fff;}
  .tab-btn:not(.active):hover{background:var(--surface-2);}

  .tab-panel{display:none;padding:16px;max-width:1100px;margin:0 auto;}
  .tab-panel.active{display:block;}

  /* ---------- Section headers ---------- */
  .section-head{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:12px;flex-wrap:wrap;gap:8px;
  }
  .section-head h2{font-size:17px;margin:0;color:var(--primary);}
  .section-hint{font-size:12px;color:var(--ink-soft);margin-top:3px;}

  .btn{
    border:none;border-radius:8px;
    padding:8px 14px;font-size:13px;font-weight:500;
    cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;gap:5px;
  }
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-light);}
  .btn-outline{background:var(--surface);color:var(--primary);border:1px solid var(--primary);}
  .btn-outline:hover{background:var(--primary-tint);}
  .btn-ghost{background:transparent;color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--negative);}
  .btn-sm{padding:5px 10px;font-size:12px;}

  /* ---------- Overview toolbar ---------- */
  .toolbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;
    box-shadow:var(--shadow);
  }
  .toolbar .sel-label{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .color-field{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft);}
  .color-field input[type=color]{
    width:26px;height:26px;border:1px solid var(--border);border-radius:6px;
    padding:0;background:none;cursor:pointer;
  }
  .toolbar-spacer{flex:1;}

  /* ---------- Spreadsheet ---------- */
  .sheet-wrap{
    overflow-x:auto;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--surface);
    box-shadow:var(--shadow);
  }
  table.sheet{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px;table-layout:fixed;}
  table.sheet th, table.sheet td{
    border:1px solid var(--border);
    padding:0;position:relative;
  }
  table.sheet thead th{
    background:var(--primary-tint);
    color:var(--primary);
    font-weight:700;
    text-align:left;
    user-select:none;
  }
  .th-inner{
    position:relative;
    padding:10px 30px 10px 10px;
    min-height:36px;
    cursor:pointer;
  }
  .th-inner[contenteditable]{outline:none;}
  .th-label{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;word-break:keep-all;}
  .th-label:focus{white-space:normal;overflow:visible;word-break:break-word;}
  .col-resize-handle{
    position:absolute;top:0;right:-4px;width:10px;height:100%;
    cursor:col-resize;z-index:6;touch-action:none;
  }
  .col-resize-handle::after{
    content:'';position:absolute;top:6px;bottom:6px;right:3px;width:4px;
    border-radius:2px;background:var(--accent);opacity:.35;
  }
  .col-resize-handle:hover::after, .col-resize-handle.active::after{opacity:1;}
  .row-resize-handle{
    position:absolute;left:0;bottom:-4px;width:100%;height:10px;
    cursor:row-resize;z-index:6;touch-action:none;
  }
  .row-resize-handle::after{
    content:'';position:absolute;left:6px;right:6px;bottom:3px;height:4px;
    border-radius:2px;background:var(--accent);opacity:.35;
  }
  .row-resize-handle:hover::after, .row-resize-handle.active::after{opacity:1;}
  .th-del{
    position:absolute;top:3px;right:3px;
    width:22px;height:22px;
    border:none;background:var(--surface);color:var(--primary);opacity:.55;
    cursor:pointer;font-size:12px;line-height:1;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 2px rgba(43,31,39,0.15);
  }
  .th-del:hover, .th-del:active{opacity:1;background:var(--negative-tint);color:var(--negative);}
  .th-add-cell{
    background:var(--surface-2);color:var(--primary);
    text-align:center;cursor:pointer;font-weight:700;min-width:76px;
  }
  .th-add-cell:hover, .th-add-cell:active{background:var(--primary-tint);}
  .th-add-inner{padding:9px 8px;}
  .th-idx{width:60px;min-width:60px;background:var(--primary-tint);}

  td.cell-idx{
    background:var(--surface-2);color:var(--ink-soft);
    width:60px;min-width:60px;
  }
  .cell-idx-inner{
    position:relative;
    padding:8px 26px 8px 6px;
    min-height:36px;
  }
  .idx-num{
    font-size:12px;cursor:pointer;display:block;text-align:center;
    padding:4px 0;border-radius:5px;
  }
  .idx-num:active{background:rgba(122,46,67,0.12);}
  .idx-del{
    position:absolute;top:3px;right:2px;
    width:20px;height:20px;
    border:none;background:var(--surface);color:var(--negative);opacity:.55;
    cursor:pointer;font-size:11px;line-height:1;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 2px rgba(43,31,39,0.15);
  }
  .idx-del:hover, .idx-del:active{opacity:1;background:var(--negative-tint);}

  .cell-input{
    min-height:34px;padding:8px 9px;outline:none;
    white-space:pre-wrap;word-break:break-word;
    cursor:text;
  }
  .cell-input:focus{box-shadow:inset 0 0 0 2px var(--primary-light);}
  td.selected{box-shadow:inset 0 0 0 2px var(--accent);}
  th.selected{box-shadow:inset 0 0 0 2px var(--accent);}
  tr.row-selected td{box-shadow:inset 0 0 0 2px var(--accent);}
  .num-cell{text-align:right;font-variant-numeric:tabular-nums;}
  .neg{color:var(--negative);}

  tfoot td{
    background:var(--surface-2);
    font-weight:700;
    padding:10px 9px;
    font-variant-numeric:tabular-nums;
  }
  tfoot td.foot-label{color:var(--primary);}
  tfoot .num-cell{text-align:right;}

  .row-add-bar{
    padding:10px;text-align:center;
    background:var(--surface);
  }

  /* ---------- Customers ---------- */
  .cust-grid{display:flex;flex-direction:column;gap:10px;}
  .cust-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:6px;
  }
  .cust-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .cust-name{font-size:15px;font-weight:700;color:var(--primary);}
  .cust-meta{font-size:12px;color:var(--ink-soft);display:flex;gap:14px;flex-wrap:wrap;}
  .cust-stats{
    display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;
  }
  .stat-chip{
    background:var(--primary-tint);color:var(--primary);
    border-radius:8px;padding:5px 10px;font-size:12px;font-weight:500;
  }
  .cust-form{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:8px;margin-bottom:14px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);
  }
  .cust-form input, .cust-form textarea{
    border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;font-family:inherit;font-size:13px;color:var(--ink);
    background:var(--bg);
  }
  .cust-form .full{grid-column:1/-1;}

  input, textarea, select{outline:none;}
  input:focus, textarea:focus{border-color:var(--primary-light);}

  .empty-hint{
    text-align:center;color:var(--ink-soft);font-size:13px;
    padding:26px 10px;background:var(--surface);border:1px dashed var(--border);
    border-radius:var(--radius);
  }

  /* ---------- Calendar ---------- */
  .cal-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px;}
  .cal-nav button{background:var(--surface);border:1px solid var(--border);
    width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--primary);font-size:16px;}
  .cal-nav .cal-title{font-weight:700;color:var(--primary);font-size:15px;min-width:110px;text-align:center;}
  .cal-grid{
    display:grid;grid-template-columns:repeat(7,1fr);
    gap:4px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:10px;box-shadow:var(--shadow);
  }
  .cal-dow{text-align:center;font-size:11px;color:var(--ink-soft);font-weight:700;padding-bottom:4px;}
  .cal-day{
    min-height:56px;border-radius:8px;background:var(--bg);
    padding:4px 5px;font-size:11px;color:var(--ink-soft);cursor:pointer;
    border:1px solid transparent;position:relative;
  }
  .cal-day.has-entry{background:var(--primary-tint);border-color:var(--accent);}
  .cal-day.today{border-color:var(--primary);}
  .cal-day.empty{background:transparent;cursor:default;}
  .cal-day .d-num{font-weight:700;color:var(--ink);font-size:12px;}
  .cal-day .d-badge{
    margin-top:3px;background:var(--primary);color:#fff;border-radius:6px;
    font-size:10px;padding:1px 5px;display:inline-block;
  }
  .cal-detail{
    margin-top:12px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);
  }
  .cal-detail h3{margin:0 0 8px;font-size:14px;color:var(--primary);}
  .cal-detail-row{
    display:flex;justify-content:space-between;font-size:13px;
    padding:6px 0;border-bottom:1px solid var(--border);
  }
  .cal-detail-row:last-child{border-bottom:none;}

  /* ---------- Brand settings ---------- */
  .brand-form{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;max-width:460px;
  }
  .field-row label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
  .field-row input[type=text]{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 11px;
    font-family:inherit;font-size:14px;background:var(--bg);color:var(--ink);
  }
  .emoji-picks{display:flex;gap:8px;flex-wrap:wrap;}
  .emoji-pick{
    width:40px;height:40px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg);font-size:19px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .emoji-pick.active{border-color:var(--primary);background:var(--primary-tint);}
  .color-picks{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .swatch{
    width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  }
  .swatch.active{border-color:var(--ink);}
  .preview-box{
    border:1px solid var(--border);border-radius:var(--radius);padding:16px;
    display:flex;align-items:center;gap:12px;background:var(--bg);
  }

  .save-toast{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;font-size:12.5px;
    opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;z-index:99;
  }
  .save-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- Modal ---------- */
  .modal-mask{
    position:fixed;inset:0;background:rgba(43,31,39,0.4);
    display:none;align-items:center;justify-content:center;z-index:200;padding:16px;
  }
  .modal-mask.show{display:flex;}
  .modal{
    background:var(--surface);border-radius:var(--radius);padding:20px;width:100%;max-width:340px;
    box-shadow:0 12px 30px rgba(0,0,0,0.2);
  }
  .modal h3{margin:0 0 12px;color:var(--primary);font-size:15px;}
  .modal label{display:block;font-size:12.5px;color:var(--ink-soft);margin:10px 0 5px;}
  .modal input[type=text]{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-family:inherit;font-size:14px;
  }
  .modal .radio-row{display:flex;gap:14px;font-size:13px;}
  .modal .radio-row label{display:flex;align-items:center;gap:5px;margin:0;color:var(--ink);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .modal.wide{max-width:420px;}
  .modal textarea{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 10px;
    font-family:ui-monospace,monospace;font-size:12px;min-height:90px;resize:vertical;
  }
  .cloud-steps{
    background:var(--bg);border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;font-size:12px;color:var(--ink-soft);line-height:1.7;margin-bottom:10px;
  }
  .cloud-steps a{color:var(--primary);}
  .cloud-status-ok{
    background:var(--positive-tint);color:var(--positive);border-radius:8px;
    padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px;
  }
  .cloud-code-row{display:flex;align-items:center;gap:8px;}
  .cloud-code-row code{
    background:var(--surface);border:1px solid var(--border);border-radius:6px;
    padding:4px 8px;font-size:13px;flex:1;word-break:break-all;
  }
  .field-hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}

  @media (max-width:520px){
    .app-title{font-size:16px;}
    table.sheet{font-size:12.5px;}
    .cust-form{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<div class="app-header">
  <div class="app-logo" id="brandEmoji">💇‍♀️</div>
  <div style="flex:1;min-width:0;">
    <div class="app-title" id="brandName">美業後台營運報表</div>
    <div class="app-subtitle">SALON OPERATIONS</div>
  </div>
  <div class="header-actions">
    <span class="storage-badge" id="storageBadge" title="點我設定雲端同步">偵測中…</span>
    <button type="button" class="btn btn-ghost btn-sm" id="exportBtn" title="下載目前所有資料的備份檔">匯出備份</button>
    <button type="button" class="btn btn-ghost btn-sm" id="importBtn" title="從備份檔還原資料">匯入備份</button>
    <input type="file" id="importFileInput" accept="application/json" style="display:none;">
  </div>
</div>

<div class="tab-bar">
  <button type="button" class="tab-btn active" data-tab="overview">總覽</button>
  <button type="button" class="tab-btn" data-tab="customers">客戶建檔</button>
  <button type="button" class="tab-btn" data-tab="calendar">日曆</button>
  <button type="button" class="tab-btn" data-tab="brand">品牌設定</button>
</div>

<!-- ===================== 總覽 ===================== -->
<div class="tab-panel active" id="panel-overview">
  <div class="section-head">
    <div>
      <h2>總覽報表</h2>
      <div class="section-hint">點欄名選整欄、點列號選整列、點格子選單一格，再用下方色塊套用顏色。金額欄輸入負數代表扣款。</div>
    </div>
  </div>

  <div class="toolbar">
    <span class="sel-label" id="selLabel">尚未選取</span>
    <div class="toolbar-spacer"></div>
    <div class="color-field">文字色 <input type="color" id="txtColorInput" value="#2B1F27"></div>
    <div class="color-field">底色 <input type="color" id="bgColorInput" value="#ffffff"></div>
    <button type="button" class="btn btn-ghost btn-sm" id="clearColorBtn">清除顏色</button>
  </div>

  <div class="sheet-wrap">
    <table class="sheet" id="sheetTable">
      <colgroup id="sheetColgroup"></colgroup>
      <thead id="sheetHead"></thead>
      <tbody id="sheetBody"></tbody>
      <tfoot id="sheetFoot"></tfoot>
    </table>
  </div>
  <div class="row-add-bar">
    <button type="button" class="btn btn-outline btn-sm" id="addRowBtn">＋ 新增列</button>
  </div>
</div>

<!-- ===================== 客戶建檔 ===================== -->
<div class="tab-panel" id="panel-customers">
  <div class="section-head">
    <div>
      <h2>客戶建檔</h2>
      <div class="section-hint">消費次數與累計實收會自動從「總覽」姓名比對彙整。</div>
    </div>
    <button type="button" class="btn btn-primary" id="addCustBtn">＋ 新增客戶</button>
  </div>
  <div id="custFormWrap"></div>
  <div class="cust-grid" id="custList"></div>
</div>

<!-- ===================== 日曆 ===================== -->
<div class="tab-panel" id="panel-calendar">
  <div class="section-head">
    <div>
      <h2>日曆檢視</h2>
      <div class="section-hint">依「總覽」日期欄位（格式如 8/27）自動標示當月有紀錄的日子。</div>
    </div>
  </div>
  <div class="cal-nav">
    <button type="button" id="calPrev">‹</button>
    <div class="cal-title" id="calTitle"></div>
    <button type="button" id="calNext">›</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>
  <div class="cal-detail" id="calDetail" style="display:none;"></div>
</div>

<!-- ===================== 品牌設定 ===================== -->
<div class="tab-panel" id="panel-brand">
  <div class="section-head">
    <div>
      <h2>品牌設定</h2>
      <div class="section-hint">設定店名、識別色與圖示，會套用到整個系統。</div>
    </div>
  </div>
  <div class="brand-form">
    <div class="field-row">
      <label>店名 / 系統標題</label>
      <input type="text" id="brandNameInput" placeholder="例如：Belle 美睫美甲工作室">
    </div>
    <div class="field-row">
      <label>圖示</label>
      <div class="emoji-picks" id="emojiPicks"></div>
    </div>
    <div class="field-row">
      <label>主色調</label>
      <div class="color-picks" id="colorPicks"></div>
    </div>
    <div class="field-row">
      <label>預覽</label>
      <div class="preview-box">
        <div class="app-logo" id="previewLogo" style="width:36px;height:36px;font-size:17px;">💇‍♀️</div>
        <div>
          <div style="font-weight:700;color:var(--primary);" id="previewName">美業後台營運報表</div>
          <div style="font-size:11px;color:var(--ink-soft);">按鈕與強調色會使用此色調</div>
        </div>
      </div>

<div class="save-toast" id="saveToast">已自動儲存</div>

<div class="modal-mask" id="colModalMask">
  <div class="modal">
    <h3>新增欄位</h3>
    <label>欄位名稱</label>
    <input type="text" id="newColName" placeholder="例如：付款方式">
    <label>欄位類型</label>

      <button type="button" class="btn btn-ghost btn-sm" id="colModalCancel">取消</button>
      <button type="button" class="btn btn-primary btn-sm" id="colModalOk">新增</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  /* ---------------- global error visibility -----------------
     Some sandboxed preview environments silently swallow errors (and even
     window.alert calls), which made earlier bugs look like "nothing
     happens" with zero clues. This banner makes any uncaught error visible
     directly on the page itself, no dev tools or alert() needed.
  --------------------------------------------------------------- */
  function showDebugBanner(msg){
    let el = document.getElementById('__debugBanner');
    if(!el){
      el = document.createElement('div');
      el.id = '__debugBanner';
      el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#B5484F;color:#fff;'
        + 'font-family:sans-serif;font-size:12px;padding:10px 36px 10px 12px;line-height:1.5;'
        + 'box-shadow:0 2px 8px rgba(0,0,0,.3);white-space:pre-wrap;word-break:break-word;';
      const closeBtn = document.createElement('button');
      closeBtn.textContent = '✕';
      closeBtn.style.cssText = 'position:absolute;top:6px;right:8px;background:none;border:none;color:#fff;font-size:16px;cursor:pointer;';
      closeBtn.onclick = ()=>{ el.remove(); };
      el.appendChild(closeBtn);
      const textEl = document.createElement('div');
      textEl.id = '__debugBannerText';
      el.appendChild(textEl);
      document.body.appendChild(el);
    }
    const textEl = document.getElementById('__debugBannerText');
    const line = document.createElement('div');
    line.textContent = '⚠️ ' + msg;
    textEl.appendChild(line);
  }
  window.addEventListener('error', function(e){
    showDebugBanner('程式發生錯誤：' + (e.message || (e.error && e.error.message) || '未知錯誤'));
  });
  window.addEventListener('unhandledrejection', function(e){
    const reason = e.reason;
    showDebugBanner('未處理的錯誤：' + (reason && reason.message ? reason.message : String(reason)));
  });

  /* ---------------- utils ---------------- */
  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
  function debounce(fn, ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
  function fmtNum(n){
    if(n===null || n===undefined || isNaN(n)) return '';
    return n.toLocaleString('zh-TW');
  }
  function parseNum(str){
    if(str===undefined || str===null) return NaN;
    const cleaned = String(str).replace(/[,\s$，元]/g,'').trim();
    if(cleaned==='' || cleaned==='-') return NaN;
    const n = Number(cleaned);
    return isNaN(n) ? NaN : n;
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function showToast(msg){
    const t = document.getElementById('saveToast');
    if(!t) return;
    t.textContent = msg || '已自動儲存';
    t.classList.add('show');
    clearTimeout(showToast._h);
    showToast._h = setTimeout(()=>t.classList.remove('show'), 1200);
  }

  /* ---------------- storage backend detection ----------------
     Priority 1: window.storage — only works when this page is running
     INSIDE Claude's own chat interface (as a live artifact), not after
     downloading the file.
     Priority 2: localStorage — works in a normal browser (Safari/Chrome)
     once the file is opened as a real page, and persists between visits.
     Priority 3: in-memory only — some sandboxed previews (e.g. iOS Notes'
     built-in preview) block all storage entirely; in that case we keep
     data in memory for the session and rely on manual export/import.
  ------------------------------------------------------------------ */
  /* ---------------- storage backend detection ----------------
     Priority 1: window.storage — only works when this page is running
     INSIDE Claude's own chat interface (as a live artifact), not after
     downloading the file.
     Priority 2: localStorage — works in a normal browser (Safari/Chrome)
     once the file is opened as a real page, and persists between visits.
     Priority 3: in-memory only — some sandboxed previews (e.g. iOS Notes'
     built-in preview) block all storage entirely; in that case we keep
     data in memory for the session and rely on manual export/import.

     Saving is written to EVERY backend that's available at once (not just
     the "primary" one) — this way, if window.storage has a transient
     hiccup, the localStorage copy still lands safely, and vice versa.
     A failure toast is only shown if ALL available backends failed, and
     even then at most once every few seconds so rapid typing doesn't
     spam the screen with error messages.
  ------------------------------------------------------------------ */
  const LOCAL_PREFIX = 'beautyErp:';
  let storageBackend = 'none'; // badge display only: 'claude' | 'local' | 'none'
  let claudeStorageOk = false;
  let localStorageOk = false;
  let lastFailToastAt = 0;
  const TIMED_OUT = Symbol('timed_out');

  // Some sandboxed preview environments (e.g. iOS Files-app QuickLook) expose
  // an object at window.storage that never actually resolves or rejects —
  // without a timeout, awaiting it hangs the whole detection step forever
  // (which is why the badge could get permanently stuck on "偵測中…").
  function withTimeout(promise, ms){
    return Promise.race([
      Promise.resolve(promise),
      new Promise(resolve=>setTimeout(()=>resolve(TIMED_OUT), ms)),
    ]);
  }

  async function detectStorageBackend(){
    if(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.set === 'function'){
      try{
        const setResult = await withTimeout(window.storage.set('__probe__', '1', false), 1500);
        if(setResult === TIMED_OUT) throw new Error('window.storage.set 逾時無回應');
        const r = await withTimeout(window.storage.get('__probe__', false), 1500);
        if(r === TIMED_OUT) throw new Error('window.storage.get 逾時無回應');
        if(r && r.value === '1'){ claudeStorageOk = true; }
      }catch(e){ claudeStorageOk = false; }
    }
    try{
      localStorage.setItem(LOCAL_PREFIX+'__probe__', '1');
      localStorageOk = localStorage.getItem(LOCAL_PREFIX+'__probe__') === '1';
      localStorage.removeItem(LOCAL_PREFIX+'__probe__');
    }catch(e){ localStorageOk = false; }

    storageBackend = claudeStorageOk ? 'claude' : (localStorageOk ? 'local' : 'none');
  }

  async function loadKey(key, fallback){
    if(claudeStorageOk){
      try{
        const res = await withTimeout(window.storage.get(key, false), 1500);
        if(res === TIMED_OUT) throw new Error('逾時');
        if(res && res.value) return JSON.parse(res.value);
      }catch(e){ /* try local next */ }
    }
    if(localStorageOk){
      try{
        const raw = localStorage.getItem(LOCAL_PREFIX+key);
        if(raw) return JSON.parse(raw);
      }catch(e){ /* fall through */ }
    }
    return fallback;
  }

  async function saveKey(key, value){
    const json = JSON.stringify(value);
    let anySucceeded = false;

    if(claudeStorageOk){
      try{
        const result = await withTimeout(window.storage.set(key, json, false), 1500);
        if(result === TIMED_OUT) throw new Error('逾時');
        anySucceeded = true;
      }
      catch(e){ console.error('window.storage 儲存失敗，改用瀏覽器本機儲存', e); }
    }
    if(localStorageOk){
      try{ localStorage.setItem(LOCAL_PREFIX+key, json); anySucceeded = true; }
      catch(e){ console.error('localStorage 儲存失敗', e); }
    }

    if(anySucceeded){
      showToast('已自動儲存');
    } else {
      const now = Date.now();
      if(now - lastFailToastAt > 8000){
        lastFailToastAt = now;
        showToast('⚠️ 自動儲存失敗，請點右上角「匯出備份」保存');
      }
    }
  }

  function updateStorageBadge(){
    const el = document.getElementById('storageBadge');
    if(!el) return;
    if(cloudConnected){ el.textContent='☁️ 雲端同步中'; el.title='資料會即時同步到所有連同一個同步代碼的裝置（點我查看代碼）'; return; }
    if(cloudConfigured && !cloudConnected){ el.textContent='☁️ 雲端連線中…'; el.title='正在連接雲端資料庫'; return; }
    if(storageBackend==='claude'){ el.textContent='💾 自動儲存中'; el.title='資料會儲存在這個對話裡（點我可設定跨裝置雲端同步）'; }
    else if(storageBackend==='local'){ el.textContent='💾 自動儲存中'; el.title='資料會保存在這個瀏覽器裡（點我可設定跨裝置雲端同步）'; }
    else { el.textContent='⚠️ 無法自動儲存'; el.title='這個瀏覽器/預覽環境擋掉了儲存功能，請改用「匯出備份」手動保存，或改用 Safari 開啟此檔案'; }
  }

  /* ================= CLOUD SYNC (optional, via person's own free Firebase project) ================= */
  const CLOUD_CFG_KEY = 'beautyErp:cloudConfig';
  let cloudConfigured = false;   // a config has been saved locally
  let cloudConnected = false;    // actively receiving live updates right now
  let cloudSyncCode = '';
  let cloudConfigObj = null;
  let cloudPushTimer = null;
  let applyingRemote = false; // guard so applying a remote update doesn't immediately re-push

  function randomSyncCode(){
    return Math.random().toString(36).slice(2,6) + '-' + Math.random().toString(36).slice(2,6);
  }

  // Firebase console gives a JS object literal (unquoted keys), not strict JSON —
  // pull out the fields we need with targeted regexes instead of eval()'ing user input.
  function parseFirebaseConfigText(text){
    const fields = ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'];
    const cfg = {};
    fields.forEach(f=>{
      const re = new RegExp(f + '\\s*:\\s*["\']([^"\']+)["\']');
      const m = re.exec(text);
      if(m) cfg[f] = m[1];
    });
    if(!cfg.apiKey || !cfg.projectId) return null;
    return cfg;
  }

  // The actual Firebase loading code lives in a separate <script type="module">
  // tag near the end of the document (window.__loadFirebaseModules), because
  // dynamic import() syntax isn't reliably supported inside a plain classic
  // <script> in every WebKit sandbox — putting it in a real module script
  // avoids that entirely. That module script does NOT run anything on its
  // own; it only defines the loader function, so there is zero network
  // activity unless the person clicks "連線" below.
  let cloudApiPromise = null;
  function loadCloudSyncApi(){
    if(cloudApiPromise) return cloudApiPromise;
    if(typeof window.__loadFirebaseModules !== 'function'){
      return Promise.reject(new Error('雲端同步模組尚未就緒'));
    }
    cloudApiPromise = window.__loadFirebaseModules();
    return cloudApiPromise;
  }
  let cloudApi = null;

  function applyCloudData(data){
    applyingRemote = true;
    if(data.overview) state.overview = data.overview;
    if(data.customers) state.customers = data.customers;
    if(data.brand) state.brand = data.brand;
    state.selection = null;
    applyBrand(false);
    renderEverything();
    // mirror into local cache too, so this device still has an offline copy
    if(localStorageOk){
      try{
        localStorage.setItem(LOCAL_PREFIX+'overview:data', JSON.stringify(state.overview));
        localStorage.setItem(LOCAL_PREFIX+'customers:list', JSON.stringify(state.customers));
        localStorage.setItem(LOCAL_PREFIX+'brand:settings', JSON.stringify(state.brand));
      }catch(e){/* ignore */}
    }
    applyingRemote = false;
    updateStorageBadge();
    showToast('☁️ 已同步其他裝置的更新');
  }

  function setCloudStatus(msg, isError){
    const el = document.getElementById('cloudStatusMsg');
    if(!el) return;
    el.textContent = msg || '';
    el.style.color = isError ? 'var(--negative)' : 'var(--ink-soft)';
  }

  async function connectCloud(config, syncCode, {silent}={}){
    let api;
    if(!silent) setCloudStatus('正在下載雲端同步元件…（第一次連線約需幾秒）', false);
    try{
      const loaded = await withTimeout(loadCloudSyncApi(), 8000);
      if(loaded === TIMED_OUT){
        const msg = '雲端同步元件下載逾時，請確認網路連線後再試一次。';
        if(!silent) setCloudStatus('⚠️ '+msg, true); else console.error(msg);
        return false;
      }
      api = loaded;
      cloudApi = api;
    }catch(e){
      const msg = '雲端同步元件載入失敗：' + (e && e.message ? e.message : String(e));
      if(!silent) setCloudStatus('⚠️ '+msg, true); else console.error(msg, e);
      return false;
    }
    if(!silent) setCloudStatus('元件已載入，正在連線資料庫…', false);
    let specificErrorShown = false;
    const success = await api.connect(config, syncCode, applyCloudData, (err)=>{
      const msg = '無法連線到雲端資料庫：' + (err && err.message ? err.message : String(err));
      console.error('雲端同步發生錯誤', err);
      cloudConnected = false;
      updateStorageBadge();
      specificErrorShown = true;
      if(!silent) setCloudStatus('⚠️ '+msg, true);
    });
    if(success){
      cloudConnected = true;
      cloudConfigured = true;
      cloudSyncCode = syncCode;
      cloudConfigObj = config;
      try{ localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify({firebaseConfig:config, syncCode})); }catch(e){}
      updateStorageBadge();
      if(!silent) setCloudStatus('✅ 連線成功！', false);
      schedulePushToCloud(); // push whatever we currently have so the cloud doc exists
    } else if(!silent && !specificErrorShown){
      setCloudStatus('⚠️ 連線失敗，請確認貼上的設定內容是否正確。', true);
    }
    return success;
  }

  function disconnectCloud(){
    if(cloudApi) cloudApi.disconnect();
    cloudConnected = false;
    cloudConfigured = false;
    cloudSyncCode = '';
    cloudConfigObj = null;
    try{ localStorage.removeItem(CLOUD_CFG_KEY); }catch(e){}
    updateStorageBadge();
  }

  function schedulePushToCloud(){
    if(!cloudConnected || applyingRemote || !cloudApi) return;
    clearTimeout(cloudPushTimer);
    cloudPushTimer = setTimeout(async ()=>{
      const payload = { overview: state.overview, customers: state.customers, brand: state.brand, updatedAt: Date.now() };
      const ok = await cloudApi.write(cloudSyncCode, payload);
      if(!ok) showToast('⚠️ 雲端同步失敗，稍後會自動重試');
    }, 500);
  }

  async function tryAutoConnectCloud(){
    let raw = null;
    try{ raw = localStorage.getItem(CLOUD_CFG_KEY); }catch(e){}
    if(!raw) return;
    let saved;
    try{ saved = JSON.parse(raw); }catch(e){ return; }
    if(!saved || !saved.firebaseConfig || !saved.syncCode) return;
    cloudConfigured = true;
    updateStorageBadge();
    await connectCloud(saved.firebaseConfig, saved.syncCode, {silent:true});
  }

  function renderCloudModal(){
    const body = document.getElementById('cloudModalBody');
    if(cloudConnected){
      body.innerHTML = `
        <div class="cloud-status-ok">
          <div>✅ 已連線，這台裝置的變更會即時同步。</div>
          <div class="cloud-code-row">
            <code id="cloudCodeDisplay">${escapeHtml(cloudSyncCode)}</code>
            <button type="button" class="btn btn-outline btn-sm" id="cloudCopyCodeBtn">複製代碼</button>
          </div>
          <div style="font-size:11.5px;">在另一台裝置的雲端設定裡貼上同一組 Firebase 設定＋同一個同步代碼，就會看到一樣的資料。</div>
        </div>
        <div class="modal-actions" style="margin-top:12px;">
          <button type="button" class="btn btn-ghost btn-sm" id="cloudDisconnectBtn">中斷雲端同步</button>
        </div>`;
      document.getElementById('cloudCopyCodeBtn').addEventListener('click', ()=>{
        navigator.clipboard && navigator.clipboard.writeText(cloudSyncCode).then(()=>showToast('已複製同步代碼'));
      });
      document.getElementById('cloudDisconnectBtn').addEventListener('click', ()=>{
        if(confirm('確定要中斷雲端同步嗎？資料會保留在這台裝置的本機儲存中。')){
          disconnectCloud();
          renderCloudModal();
        }
      });
    } else {
      const suggestedCode = cloudSyncCode || randomSyncCode();
      body.innerHTML = `
        <div class="cloud-steps">
          <b>申請免費 Firebase（約 3 分鐘，一次就好）：</b><br>
          1. 開啟 <a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a>，用 Google 帳號登入 →「建立專案」，隨便命名，可跳過 Analytics<br>
          2. 左側選單「Firestore Database」→「建立資料庫」→ 選「測試模式」→ 選一個地區 → 完成<br>
          3. 左側「專案設定」（齒輪圖示）→ 拉到「您的應用程式」→ 點網頁圖示 &lt;/&gt; → 隨便命名 → 註冊<br>
          4. 把畫面上出現的整段 <code>firebaseConfig = {...}</code> 複製，貼到下面
        </div>
        <label>貼上 Firebase 設定</label>
        <textarea id="cloudConfigInput" placeholder='const firebaseConfig = { apiKey: "...", projectId: "...", ... };'></textarea>
        <label>同步代碼（其他裝置要輸入一樣的代碼才會同步同一份資料）</label>
        <input type="text" id="cloudSyncCodeInput" value="${escapeHtml(suggestedCode)}">
        <div class="field-hint">建議自訂一個不容易被猜到的代碼，例如店名+數字。</div>
        <div id="cloudStatusMsg" class="field-hint" style="min-height:16px;font-weight:600;"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-primary btn-sm" id="cloudConnectBtn">連線</button>
        </div>`;
      document.getElementById('cloudConnectBtn').addEventListener('click', async ()=>{
        const txt = document.getElementById('cloudConfigInput').value.trim();
        const code = document.getElementById('cloudSyncCodeInput').value.trim();
        if(!txt || !code){ setCloudStatus('⚠️ 請貼上 Firebase 設定並填寫同步代碼', true); return; }
        const cfg = parseFirebaseConfigText(txt);
        if(!cfg){ setCloudStatus('⚠️ 看起來不是有效的 Firebase 設定，請確認整段都有貼上（需包含 apiKey 與 projectId）', true); return; }
        const btn = document.getElementById('cloudConnectBtn');
        btn.textContent = '連線中…'; btn.disabled = true;
        setCloudStatus('開始連線…', false);
        try{
          const ok = await connectCloud(cfg, code);
          if(ok) setTimeout(()=>renderCloudModal(), 600);
        }catch(e){
          console.error('連線發生未預期錯誤', e);
          setCloudStatus('⚠️ 發生未預期的錯誤：' + (e && e.message ? e.message : String(e)), true);
        }finally{
          if(document.body.contains(btn)){ btn.textContent = '連線'; btn.disabled = false; }
        }
      });
    }
  }

  function bindCloudModal(){
    document.getElementById('storageBadge').addEventListener('click', ()=>{
      renderCloudModal();
      document.getElementById('cloudModalMask').classList.add('show');
    });
    document.getElementById('cloudModalClose').addEventListener('click', ()=>{
      document.getElementById('cloudModalMask').classList.remove('show');
    });
    document.getElementById('cloudModalMask').addEventListener('click', (e)=>{
      if(e.target.id==='cloudModalMask') document.getElementById('cloudModalMask').classList.remove('show');
    });
  }

  /* ---------------- manual backup (works everywhere, even storageBackend==='none') ---------------- */
  function exportBackup(){
    const payload = { overview: state.overview, customers: state.customers, brand: state.brand, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `美業後台備份_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function importBackupFile(file){
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!confirm('匯入備份會覆蓋目前畫面上的資料，確定要繼續嗎？')) return;
        if(data.overview) state.overview = data.overview;
        if(data.customers) state.customers = data.customers;
        if(data.brand) state.brand = data.brand;
        state.selection = null;
        applyBrand(false);
        renderEverything();
        saveOverview(); saveCustomers(); saveBrand();
        showToast('已匯入備份');
      }catch(e){
        alert('這個檔案看起來不是有效的備份檔，請確認格式。');
      }
    };
    reader.readAsText(file);
  }
  const saveOverviewNow = ()=>{ saveKey('overview:data', state.overview); schedulePushToCloud(); };
  const saveCustomersNow = ()=>{ saveKey('customers:list', state.customers); schedulePushToCloud(); };
  const saveBrandNow = ()=>{ saveKey('brand:settings', state.brand); schedulePushToCloud(); };
  const saveOverview = debounce(saveOverviewNow, 500);
  const saveCustomers = debounce(saveCustomersNow, 500);
  const saveBrand = debounce(saveBrandNow, 400);

  /* ---------------- state ---------------- */
  const DEFAULT_COLUMNS = [
    {id:'date', label:'日期', type:'text', summable:false, width:76},
    {id:'name', label:'姓名', type:'text', summable:false, width:90},
    {id:'item', label:'項目', type:'text', summable:false, width:150},
    {id:'revenue', label:'營收', type:'number', summable:true, width:92},
    {id:'received', label:'實收', type:'number', summable:true, width:92},
    {id:'commission', label:'抽成', type:'number', summable:true, width:92},
    {id:'note', label:'備註', type:'text', summable:false, width:150},
  ];

  function sampleRow(date,name,item,rev,rec,com,note){
    return { id: uid(), cells: {
      date:{v:date,color:'',bg:''}, name:{v:name,color:'',bg:''}, item:{v:item,color:'',bg:''},
      revenue:{v:String(rev),color:'',bg:''}, received:{v:String(rec),color:'',bg:''},
      commission:{v:String(com),color:'',bg:''}, note:{v:note,color:'',bg:''}
    }};
  }

  /* ================= OVERVIEW ================= */
  function renderColgroup(){
    const ov = state.overview;
    const colgroup = document.getElementById('sheetColgroup');
    if(!colgroup) return;
    let html = '<col style="width:60px">';
    ov.columns.forEach(col=>{
      html += `<col data-col="${col.id}" style="width:${col.width||120}px">`;
    });
    html += '<col style="width:78px">';
    colgroup.innerHTML = html;
  }

  function renderOverview(){
    const ov = state.overview;
    const head = document.getElementById('sheetHead');
    const body = document.getElementById('sheetBody');

    renderColgroup();

    // header
    let headHtml = '<tr><th class="th-idx"></th>';
    ov.columns.forEach(col=>{
      const isSel = state.selection && state.selection.type==='col' && state.selection.colId===col.id;
      headHtml += `<th data-col="${col.id}" class="${isSel?'selected':''}">
        <div class="th-inner" data-col="${col.id}">
          <span class="th-label" contenteditable="true" data-col="${col.id}">${escapeHtml(col.label)}</span>
          <button type="button" class="th-del" data-col="${col.id}" title="刪除欄位">✕</button>
          <div class="col-resize-handle" data-col="${col.id}" title="拖曳調整欄寬"></div>
        </div>
      </th>`;
    });
    headHtml += `<th class="th-add-cell" id="addColBtn"><div class="th-add-inner">＋ 新增欄</div></th></tr>`;
    head.innerHTML = headHtml;

    // body
    let bodyHtml = '';
    ov.rows.forEach((row, idx)=>{
      const rowSel = state.selection && state.selection.type==='row' && state.selection.rowId===row.id;
      const rowHeightStyle = row.height ? `style="height:${row.height}px"` : '';
      bodyHtml += `<tr data-row="${row.id}" class="${rowSel?'row-selected':''}" ${rowHeightStyle}>
        <td class="cell-idx" data-row="${row.id}">
          <div class="cell-idx-inner">
            <span class="idx-num" data-row="${row.id}">${idx+1}</span>
            <button type="button" class="idx-del" data-row="${row.id}" title="刪除這一列">✕</button>
            <div class="row-resize-handle" data-row="${row.id}" title="拖曳調整列高"></div>
          </div>
        </td>`;
      ov.columns.forEach(col=>{
        const cell = row.cells[col.id] || {v:'',color:'',bg:''};
        const isNum = col.type==='number';
        const raw = cell.v || '';
        const numVal = isNum ? parseNum(raw) : NaN;
        const display = isNum && !isNaN(numVal) ? fmtNum(numVal) : escapeHtml(raw);
        const negClass = isNum && !isNaN(numVal) && numVal<0 ? 'neg' : '';
        const selClass = state.selection && state.selection.type==='cell' && state.selection.rowId===row.id && state.selection.colId===col.id ? 'selected' : '';
        const style = `${cell.color?`color:${cell.color};`:''}${cell.bg?`background:${cell.bg};`:''}`;
        bodyHtml += `<td class="${isNum?'num-cell':''} ${selClass}" data-row="${row.id}" data-col="${col.id}" style="${style}">
          <div class="cell-input ${negClass}" contenteditable="true" data-row="${row.id}" data-col="${col.id}" data-type="${col.type}">${display}</div>
        </td>`;
      });
      bodyHtml += `</tr>`;
    });
    body.innerHTML = bodyHtml || '';

    renderFooter();
    updateSelLabel();
  }

  function renderFooter(){
    const ov = state.overview;
    const foot = document.getElementById('sheetFoot');
    let html = '<tr><td class="foot-label" style="text-align:center;">合計</td>';
    ov.columns.forEach(col=>{
      if(col.type==='number'){
        const sum = ov.rows.reduce((acc,row)=>{
          const v = parseNum(row.cells[col.id] ? row.cells[col.id].v : '');
          return acc + (isNaN(v)?0:v);
        },0);
        const cls = sum<0 ? 'neg' : '';
        html += `<td class="num-cell ${cls}" data-foot="${col.id}">${fmtNum(sum)}</td>`;
      } else {
        html += `<td></td>`;
      }
    });
    html += '</tr>';
    foot.innerHTML = html;
  }

  function updateSelLabel(){
    const lbl = document.getElementById('selLabel');
    if(!lbl) return;
    const sel = state.selection;
    if(!sel){ lbl.textContent = '尚未選取（點欄名／列號／格子來選取上色範圍）'; return; }
    if(sel.type==='cell') lbl.textContent = '已選取：單一格';
    if(sel.type==='row') lbl.textContent = '已選取：整列';
    if(sel.type==='col'){
      const col = state.overview.columns.find(c=>c.id===sel.colId);
      lbl.textContent = '已選取：整欄「'+(col?col.label:'')+'」';
    }
  }

  // lightweight selection: only toggles CSS classes, never rebuilds the table
  // (rebuilding on every selection was destroying the "+ 新增欄" button's
  // listener and stealing focus while typing — this fixes that)
  function clearSelectionHighlight(){
    document.querySelectorAll('#sheetTable .selected').forEach(el=>el.classList.remove('selected'));
    document.querySelectorAll('#sheetTable .row-selected').forEach(el=>el.classList.remove('row-selected'));
  }

  function selectCell(rowId, colId){
    clearSelectionHighlight();
    state.selection = {type:'cell', rowId, colId};
    const td = document.querySelector(`#sheetBody td[data-row="${rowId}"][data-col="${colId}"]`);
    if(td) td.classList.add('selected');
    const row = state.overview.rows.find(r=>r.id===rowId);
    const c = row ? (row.cells[colId] || {}) : {};
    document.getElementById('txtColorInput').value = c.color || '#2b1f27';
    document.getElementById('bgColorInput').value = c.bg || '#ffffff';
    updateSelLabel();
  }

  function selectRow(rowId){
    clearSelectionHighlight();
    state.selection = {type:'row', rowId};
    const tr = document.querySelector(`#sheetBody tr[data-row="${rowId}"]`);
    if(tr) tr.classList.add('row-selected');
    updateSelLabel();
  }

  function selectCol(colId){
    clearSelectionHighlight();
    state.selection = {type:'col', colId};
    document.querySelectorAll(`#sheetBody td[data-col="${colId}"]`).forEach(td=>td.classList.add('selected'));
    const th = document.querySelector(`#sheetHead th[data-col="${colId}"]`);
    if(th) th.classList.add('selected');
    updateSelLabel();
  }

  function bindOverviewEvents(){
    const head = document.getElementById('sheetHead');
    const body = document.getElementById('sheetBody');

    // ---- column resize (drag the handle at the right edge of a header) ----
    let resizing = null; // {colId, startX, startWidth, liveWidth}
    function onResizeMove(e){
      if(!resizing) return;
      const delta = (e.touches ? e.touches[0].clientX : e.clientX) - resizing.startX;
      const newWidth = Math.max(50, Math.round(resizing.startWidth + delta));
      const colEl = document.querySelector(`#sheetColgroup col[data-col="${resizing.colId}"]`);
      if(colEl) colEl.style.width = newWidth+'px';
      resizing.liveWidth = newWidth;
    }
    function onResizeEnd(){
      if(!resizing) return;
      const handle = document.querySelector(`.col-resize-handle[data-col="${resizing.colId}"]`);
      if(handle) handle.classList.remove('active');
      const col = state.overview.columns.find(c=>c.id===resizing.colId);
      if(col && resizing.liveWidth) col.width = resizing.liveWidth;
      resizing = null;
      document.removeEventListener('pointermove', onResizeMove);
      document.removeEventListener('pointerup', onResizeEnd);
      document.body.style.userSelect = '';
      saveOverview();
    }
    head.addEventListener('pointerdown', (e)=>{
      const handle = e.target.closest('.col-resize-handle');
      if(!handle) return;
      e.preventDefault();
      e.stopPropagation();
      const colId = handle.dataset.col;
      const col = state.overview.columns.find(c=>c.id===colId);
      resizing = { colId, startX: e.clientX, startWidth: (col && col.width) || 120 };
      handle.classList.add('active');
      document.body.style.userSelect = 'none';
      document.addEventListener('pointermove', onResizeMove);
      document.addEventListener('pointerup', onResizeEnd);
    });

    // ---- row resize (drag the handle at the bottom edge of a row's index cell) ----
    let rowResizing = null; // {rowId, startY, startHeight, liveHeight}
    function onRowResizeMove(e){
      if(!rowResizing) return;
      const delta = (e.touches ? e.touches[0].clientY : e.clientY) - rowResizing.startY;
      const newHeight = Math.max(30, Math.round(rowResizing.startHeight + delta));
      const tr = document.querySelector(`#sheetBody tr[data-row="${rowResizing.rowId}"]`);
      if(tr) tr.style.height = newHeight+'px';
      rowResizing.liveHeight = newHeight;
    }
    function onRowResizeEnd(){
      if(!rowResizing) return;
      const handle = document.querySelector(`.row-resize-handle[data-row="${rowResizing.rowId}"]`);
      if(handle) handle.classList.remove('active');
      const row = state.overview.rows.find(r=>r.id===rowResizing.rowId);
      if(row && rowResizing.liveHeight) row.height = rowResizing.liveHeight;
      rowResizing = null;
      document.removeEventListener('pointermove', onRowResizeMove);
      document.removeEventListener('pointerup', onRowResizeEnd);
      document.body.style.userSelect = '';
      saveOverview();
    }
    body.addEventListener('pointerdown', (e)=>{
      const handle = e.target.closest('.row-resize-handle');
      if(!handle) return;
      e.preventDefault();
      e.stopPropagation();
      const rowId = handle.dataset.row;
      const tr = document.querySelector(`#sheetBody tr[data-row="${rowId}"]`);
      const row = state.overview.rows.find(r=>r.id===rowId);
      rowResizing = { rowId, startY: e.clientY, startHeight: (row && row.height) || (tr ? tr.getBoundingClientRect().height : 40) };
      handle.classList.add('active');
      document.body.style.userSelect = 'none';
      document.addEventListener('pointermove', onRowResizeMove);
      document.addEventListener('pointerup', onRowResizeEnd);
    });

    // header: delegated clicks (works even after renderOverview rebuilds the thead)
    head.addEventListener('click', (e)=>{
      if(e.target.closest('.col-resize-handle')) return;
      const addBtn = e.target.closest('#addColBtn');
      if(addBtn){ openColumnModal(); return; }

      const delBtn = e.target.closest('.th-del');
      if(delBtn){
        const colId = delBtn.dataset.col;
        if(state.overview.columns.length<=1){ alert('至少需保留一欄'); return; }
        if(confirm('確定要刪除這個欄位嗎？此操作無法復原。')){
          state.overview.columns = state.overview.columns.filter(c=>c.id!==colId);
          state.overview.rows.forEach(r=>{ delete r.cells[colId]; });
          state.selection = null;
          renderOverview();
          saveOverview();
        }
        return;
      }

      if(e.target.classList.contains('th-label')) { selectCol(e.target.dataset.col); return; }
      const thInner = e.target.closest('.th-inner');
      if(thInner){ selectCol(thInner.dataset.col); }
    });

    head.addEventListener('blur', (e)=>{
      if(e.target.classList.contains('th-label')){
        const colId = e.target.dataset.col;
        const col = state.overview.columns.find(c=>c.id===colId);
        if(col){ col.label = e.target.textContent.trim() || col.label; }
        saveOverview();
      }
    }, true);

    // row index: select row / delete row (delegated — always visible, no hover dependency)
    body.addEventListener('click', (e)=>{
      if(e.target.closest('.row-resize-handle')) return;
      const delBtn = e.target.closest('.idx-del');
      if(delBtn){
        const rowId = delBtn.dataset.row;
        if(confirm('確定要刪除這一列嗎？')){
          state.overview.rows = state.overview.rows.filter(r=>r.id!==rowId);
          state.selection = null;
          renderOverview();
          saveOverview();
        }
        return;
      }
      const idxNum = e.target.closest('.idx-num');
      if(idxNum){ selectRow(idxNum.dataset.row); return; }

      const cellInput = e.target.closest('.cell-input');
      if(cellInput){ selectCell(cellInput.dataset.row, cellInput.dataset.col); }
    });

    // typing in cells -> update state + live totals, no full re-render (preserve cursor)
    body.addEventListener('input', (e)=>{
      const el = e.target;
      if(!el.classList.contains('cell-input')) return;
      const rowId = el.dataset.row, colId = el.dataset.col, type = el.dataset.type;
      const row = state.overview.rows.find(r=>r.id===rowId);
      if(!row) return;
      if(!row.cells[colId]) row.cells[colId] = {v:'',color:'',bg:''};
      row.cells[colId].v = el.textContent;
      if(type==='number'){
        const n = parseNum(el.textContent);
        el.classList.toggle('neg', !isNaN(n) && n<0);
        renderFooter();
      }
      saveOverview();
    });

    // format number cells nicely on blur
    body.addEventListener('blur', (e)=>{
      const el = e.target;
      if(!el.classList || !el.classList.contains('cell-input')) return;
      if(el.dataset.type==='number'){
        const n = parseNum(el.textContent);
        if(!isNaN(n)){ el.textContent = fmtNum(n); }
      }
    }, true);

    document.getElementById('addRowBtn').addEventListener('click', ()=>{
      const cells = {};
      state.overview.columns.forEach(c=> cells[c.id] = {v:'',color:'',bg:''});
      state.overview.rows.push({id:uid(), cells});
      renderOverview();
      saveOverview();
    });

    // color pickers apply to current selection
    document.getElementById('txtColorInput').addEventListener('input', (e)=> applyColor('color', e.target.value));
    document.getElementById('bgColorInput').addEventListener('input', (e)=> applyColor('bg', e.target.value));
    document.getElementById('clearColorBtn').addEventListener('click', ()=>{ applyColor('color',''); applyColor('bg',''); });
  }

  function applyColor(prop, value){
    const sel = state.selection;
    if(!sel){ alert('請先點選欄名、列號或格子'); return; }
    const ov = state.overview;
    if(sel.type==='cell'){
      const row = ov.rows.find(r=>r.id===sel.rowId);
      if(row){ if(!row.cells[sel.colId]) row.cells[sel.colId]={v:'',color:'',bg:''}; row.cells[sel.colId][prop]=value; }
    } else if(sel.type==='row'){
      const row = ov.rows.find(r=>r.id===sel.rowId);
      if(row){ ov.columns.forEach(c=>{ if(!row.cells[c.id]) row.cells[c.id]={v:'',color:'',bg:''}; row.cells[c.id][prop]=value; }); }
    } else if(sel.type==='col'){
      ov.rows.forEach(row=>{ if(!row.cells[sel.colId]) row.cells[sel.colId]={v:'',color:'',bg:''}; row.cells[sel.colId][prop]=value; });
    }
    renderOverview();
    saveOverview();
  }

  function computeCustomerStats(){
    const stats = {};
    const ov = state.overview;
    const nameColId = (ov.columns.find(c=>c.label==='姓名')||{}).id || 'name';
    const receivedColId = (ov.columns.find(c=>c.label==='實收')||{}).id || 'received';
    ov.rows.forEach(row=>{
      const name = row.cells[nameColId] ? row.cells[nameColId].v : '';
      if(!name) return;
      const v = parseNum(row.cells[receivedColId] ? row.cells[receivedColId].v : '');
      if(!stats[name]) stats[name] = {count:0,total:0};
      stats[name].count += 1;
      stats[name].total += isNaN(v)?0:v;
    });
    return stats;
  }

  function getEntriesForDay(month, day){
    const ov = state.overview;
    const dateColId = (ov.columns.find(c=>c.label==='日期')||{}).id || 'date';
    const nameColId = (ov.columns.find(c=>c.label==='姓名')||{}).id || 'name';
    const itemColId = (ov.columns.find(c=>c.label==='項目')||{}).id || 'item';
    const receivedColId = (ov.columns.find(c=>c.label==='實收')||{}).id || 'received';
    const results = [];
    ov.rows.forEach(row=>{
      const raw = row.cells[dateColId] ? row.cells[dateColId].v : '';
      const m = /^(\d{1,2})\s*\/\s*(\d{1,2})/.exec((raw||'').trim());
      if(!m) return;
      const mm = parseInt(m[1],10), dd = parseInt(m[2],10);
      if(mm===month && dd===day){
        results.push({
          name: row.cells[nameColId]?row.cells[nameColId].v:'',
          item: row.cells[itemColId]?row.cells[itemColId].v:'',
          received: row.cells[receivedColId]?row.cells[receivedColId].v:'',
        });
      }
    });
    return results;
  }

  function renderCalendar(){
    const d = state.calDate;
    const year = d.getFullYear(), month = d.getMonth()+1;
    document.getElementById('calTitle').textContent = `${year} 年 ${month} 月`;

    const firstDay = new Date(year, month-1, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(year, month, 0).getDate();

    const today = new Date();
    const isCurMonth = today.getFullYear()===year && (today.getMonth()+1)===month;

    let html = ['日','一','二','三','四','五','六'].map(w=>`<div class="cal-dow">${w}</div>`).join('');
    for(let i=0;i<startWeekday;i++) html += '<div class="cal-day empty"></div>';
    for(let day=1; day<=daysInMonth; day++){
      const entries = getEntriesForDay(month, day);
      const isToday = isCurMonth && today.getDate()===day;
      html += `<div class="cal-day ${entries.length?'has-entry':''} ${isToday?'today':''}" data-day="${day}">
        <div class="d-num">${day}</div>
        ${entries.length?`<div class="d-badge">${entries.length}筆</div>`:''}
      </div>`;
    }
    document.getElementById('calGrid').innerHTML = html;

    document.getElementById('calGrid').querySelectorAll('.cal-day[data-day]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const day = parseInt(el.dataset.day,10);
        const entries = getEntriesForDay(month, day);
        const detail = document.getElementById('calDetail');
        if(entries.length===0){
          detail.style.display='block';
          detail.innerHTML = `<h3>${month}/${day}</h3><div class="empty-hint" style="border:none;padding:10px;">當天尚無紀錄</div>`;
          return;
        }
        detail.style.display='block';
        detail.innerHTML = `<h3>${month}/${day}　共 ${entries.length} 筆</h3>` +
          entries.map(en=>{
            const rv = parseNum(en.received);
            return `<div class="cal-detail-row"><span>${escapeHtml(en.name)}｜${escapeHtml(en.item)}</span><span>$${isNaN(rv)?escapeHtml(en.received):fmtNum(rv)}</span></div>`;
          }).join('');
      });
    });
  }

  /* ================= BRAND ================= */
  function applyBrand(persist){
    const b = state.brand;
    document.documentElement.style.setProperty('--primary', b.color);
    document.documentElement.style.setProperty('--primary-light', shadeColor(b.color, 15));
    document.documentElement.style.setProperty('--primary-tint', shadeColor(b.color, 82));
    document.getElementById('brandName').textContent = b.name;
    document.getElementById('brandEmoji').textContent = b.emoji;
    if(persist) saveBrand();
  }

  function shadeColor(hex, percent){
    hex = (hex||'#7A2E43').replace('#','');
    if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
    const num = parseInt(hex,16);
    let r = (num>>16), g=(num>>8 & 0x00FF), b=(num & 0x0000FF);
    r = Math.round(r + (255-r)*percent/100);
    g = Math.round(g + (255-g)*percent/100);
    b = Math.round(b + (255-b)*percent/100);
    return '#'+(0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
  }

  function renderBrandForm(){
    document.getElementById('brandNameInput').value = state.brand.name;
    document.getElementById('previewName').textContent = state.brand.name;
    document.getElementById('previewLogo').textContent = state.brand.emoji;

    const emojiWrap = document.getElementById('emojiPicks');
    emojiWrap.innerHTML = EMOJI_OPTIONS.map(em=>
      `<div class="emoji-pick ${em===state.brand.emoji?'active':''}" data-emoji="${em}">${em}</div>`
    ).join('');

    const colorWrap = document.getElementById('colorPicks');
    colorWrap.innerHTML = COLOR_OPTIONS.map(c=>
      `<div class="swatch ${c===state.brand.color?'active':''}" data-color="${c}" style="background:${c};"></div>`
    ).join('') + `<input type="color" id="customColor" value="${state.brand.color}" style="width:30px;height:30px;border:none;border-radius:50%;padding:0;cursor:pointer;">`;
  }

  function bindBrandEvents(){
    document.getElementById('emojiPicks').addEventListener('click', (e)=>{
      const el = e.target.closest('.emoji-pick');
      if(!el) return;
      state.brand.emoji = el.dataset.emoji;
      renderBrandForm();
      previewOnly();
    });
    document.getElementById('colorPicks').addEventListener('click', (e)=>{
      const el = e.target.closest('.swatch');
      if(!el) return;
      state.brand.color = el.dataset.color;
      renderBrandForm();
      previewOnly();
    });
    document.getElementById('colorPicks').addEventListener('input', (e)=>{
      if(e.target.id==='customColor'){
        state.brand.color = e.target.value;
        previewOnly();
      }
    });
    document.getElementById('brandNameInput').addEventListener('input', (e)=>{
      state.brand.name = e.target.value || '美業後台營運報表';
      document.getElementById('previewName').textContent = state.brand.name;
    });
    document.getElementById('saveBrandBtn').addEventListener('click', ()=>{
      applyBrand(true);
      renderOverview();
    });
  }

  function previewOnly(){
    document.getElementById('previewLogo').textContent = state.brand.emoji;
    document.getElementById('previewLogo').style.background = state.brand.color;
    document.getElementById('previewName').style.color = state.brand.color;
  }

  /* ================= INIT ================= */
  // 1) Bind ALL interactive elements immediately with default/in-memory state,
  //    so the whole UI is clickable right away even if storage is unavailable
  //    (e.g. when the file is opened locally instead of inside Claude).
  // 2) Then try to hydrate from persistent storage in the background.
  function bindEverything(){
    bindTabs();
    bindOverviewEvents();
    bindCustomerEvents();
    bindCalendarEvents();
    bindBrandEvents();
    bindColumnModal();
    bindCloudModal();
    document.getElementById('exportBtn').addEventListener('click', exportBackup);
    document.getElementById('importBtn').addEventListener('click', ()=>{
      document.getElementById('importFileInput').click();
    });
    document.getElementById('importFileInput').addEventListener('change', (e)=>{
      const file = e.target.files && e.target.files[0];
      if(file) importBackupFile(file);
      e.target.value = '';
    });
  }

  function renderEverything(){
    applyBrand(false);
    renderOverview();
    renderCustomers();
    renderCalendar();
    renderBrandForm();
  }

  async function hydrateFromStorage(){
    await detectStorageBackend();
    updateStorageBadge();
    if(storageBackend!=='none'){
      const [ov, custs, brand] = await Promise.all([
        loadKey('overview:data', null),
        loadKey('customers:list', null),
        loadKey('brand:settings', null),
      ]);
      if(ov) state.overview = ov;
      if(custs) state.customers = custs;
      if(brand) state.brand = brand;
      renderEverything();
    }
    // if the person previously set up cloud sync on this browser, reconnect automatically
    // (this will override the above with the latest cloud copy once it arrives)
    tryAutoConnectCloud().catch(err=>console.error('雲端自動連線失敗', err));
  }

  function init(){
    try{
      renderEverything();
      bindEverything();
    }catch(err){
      console.error('初始化發生錯誤', err);
    }
    // hard safety net: no matter what hangs inside, make sure the badge
    // reflects *something* within a few seconds instead of staying stuck
    // on "偵測中…" forever.
    const badgeTimeout = setTimeout(()=>{ updateStorageBadge(); }, 4000);
    hydrateFromStorage()
      .catch(err=>{ console.error('讀取儲存資料失敗', err); })
      .finally(()=>{ clearTimeout(badgeTimeout); updateStorageBadge(); });
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
<div class="modal-mask" id="cloudModalMask">
  <div class="modal wide">
    <h3>☁️ 雲端即時同步</h3>
    <div id="cloudModalBody"><!-- filled by JS --></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost btn-sm" id="cloudModalClose">關閉</button>
    </div>
  </div>
</div>

<script type="module">
  // This module ONLY defines a loader function — it does not import or
  // fetch anything by itself, so it has zero effect on normal page load.
  // The classic <script> above calls window.__loadFirebaseModules() itself,
  // but only when the person clicks "連線" in the cloud sync modal.
  window.__loadFirebaseModules = async function(){
    const [{ initializeApp, getApps }, { getFirestore, doc, setDoc, onSnapshot }] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js'),
    ]);
    let db = null, unsub = null;
    return {
      async connect(config, syncCode, onData, onError){
        try{
          const app = getApps().length ? getApps()[0] : initializeApp(config);
          db = getFirestore(app);
          if(unsub){ unsub(); unsub = null; }
          const ref = doc(db, 'beautyErpSalons', syncCode);
          unsub = onSnapshot(ref, (snap)=>{
            if(snap.metadata.hasPendingWrites) return; // ignore echo of our own write
            if(snap.exists()) onData(snap.data());
          }, (err)=>{ if(onError) onError(err); });
          return true;
        }catch(e){
          if(onError) onError(e);
          return false;
        }
      },
      async write(syncCode, data){
        if(!db) return false;
        try{ await setDoc(doc(db, 'beautyErpSalons', syncCode), data, {merge:false}); return true; }
        catch(e){ console.error('雲端寫入失敗', e); return false; }
      },
      disconnect(){ if(unsub){ unsub(); unsub=null; } db=null; },
    };
  };
</script>
